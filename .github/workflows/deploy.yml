name: Deployment 

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  build:
    name: Run Scripts 
    runs-on: chopd3bPrdHipaa-linux-large
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.11'
            cache: 'pip'        
        - name: Run Pipeline 
          run: |
            pip3 install -r requirements.txt
            aws s3 cp s3://d3b-684194535433-us-east-1-service-secrets/d3b-flywheel-routine-empty-containers/app.secrets .
            chmod +x ./app.secrets
            sh ./app.secrets
            python3 fw_delete_empty_containers_DataView.py
        
